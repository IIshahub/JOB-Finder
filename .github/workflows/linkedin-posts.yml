name: LinkedIn post feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-post-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install "requests>=2.31"

      - name: Search for new posts
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FEED_ROLES: ${{ vars.FEED_ROLES }}
        run: python -m scripts.update_post_feed

      - name: Commit the feed
        run: |
          if [ -z "$(git status --porcelain -- feed/)" ]; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/linkedin_posts.json
          git commit -m "Update LinkedIn post feed"
          git push
