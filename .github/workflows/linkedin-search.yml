name: LinkedIn search

run-name: "LinkedIn search: ${{ inputs.keyword }} [${{ inputs.request_id }}]"

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: Words that must appear, for example react developer
        required: true
      location:
        description: City or country, for example Tehran, Iran
        required: false
        default: ""
      since:
        description: How far back to search
        required: false
        default: month
        type: choice
        options: [day, week, month, year]
      request_id:
        description: Lets scripts/search_linkedin.py --remote find this run
        required: false
        default: manual

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install "requests>=2.31"

      - name: Search
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          KEYWORD: ${{ inputs.keyword }}
          LOCATION: ${{ inputs.location }}
          SINCE: ${{ inputs.since }}
        run: |
          mkdir -p results
          python -m scripts.search_linkedin "$KEYWORD" --location "$LOCATION" --since "$SINCE" --json results/linkedin_search.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: linkedin-search
          path: results/linkedin_search.json
          retention-days: 1
          if-no-files-found: error
